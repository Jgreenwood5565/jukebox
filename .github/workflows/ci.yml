name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the runner context isn't available in job level env, set it for all later steps
      - run: echo "JUKEBOX_HOME=$RUNNER_TEMP/jukebox" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jukebox:ci .
      - name: Smoke test
        run: |
          docker run -d --name jukebox -p 8000:8000 jukebox:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/login && exit 0
            sleep 2
          done
          docker logs jukebox
          exit 1
