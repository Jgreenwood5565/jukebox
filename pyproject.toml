[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jukebox"
version = "0.5.0"
description = "Democratic Jukebox - your democratic music player"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.rst"]
authors = [{ name = "Jens Nistler", email = "opensource@jensnistler.de" }]
keywords = ["jukebox", "music", "mp3"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "social-auth-app-django>=5.4",
    "mutagen>=1.47",
    "whitenoise>=6.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lociii/jukebox"
Changelog = "https://github.com/lociii/jukebox/blob/master/CHANGES.txt"

[project.scripts]
jukebox = "jukebox.cli:main"

[tool.setuptools.packages.find]
include = ["jukebox*"]

[tool.setuptools.package-data]
"jukebox" = ["jukebox.wsgi"]
"jukebox.jukebox_core" = ["docs/*"]
"jukebox.jukebox_web" = ["templates/*", "static/**/*", "locale/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["jukebox/jukebox_core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
